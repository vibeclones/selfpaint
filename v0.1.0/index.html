<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SelfPaint</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #202020; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f0f0f0; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Loading SelfPaint…</div>
  <canvas id="selfpaint_canvas" tabindex="0"></canvas>
  <script type="module">
    // Handle canvas resize
    const canvas = document.getElementById("selfpaint_canvas");
    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    };
    window.addEventListener("resize", resize);
    resize();
    import init, { start } from "./pkg/selfpaint.js";
    async function run() {
      await init();
      await start("selfpaint_canvas");
      document.getElementById("loading").remove();
    }
    run();
  </script>
</body>
</html>
